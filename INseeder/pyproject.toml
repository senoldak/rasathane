[project]
name = "inseeder"
version = "0.1.0"
description = "US Equities Insider Trading Detection, Conviction Scoring, Alerting, and Copy-Trading System"
authors = [{ name = "INseeder Team" }]
dependencies = ["rasathane-ortak",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "Pillow>=10.0",
    "tzdata>=2024.1",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
