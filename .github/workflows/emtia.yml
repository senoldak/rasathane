name: Emtia

# Emtia kartları: her ABD işlem günü vadeli kapanışlardan sonra (New York 18:15).
# Tatil ve hafta sonu koşuları komutun kendisi tarafından sessizce atlanır.
# Asıl tetikleyici vesaire (workflow_dispatch, kuru=false); cron satırı yedek.
on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
    inputs:
      kuru:
        description: "Kuru koşu (kartları üret, gönderme)"
        type: boolean
        default: true
      tarih:
        description: "YYYY-AA-GG (boş: bugün; yalnız son seans)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: emtia
  cancel-in-progress: false

defaults:
  run:
    working-directory: emtia

jobs:
  kanal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Kur
        run: pip install -e ../ortak -e .
      - name: Kartları üret ve gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SAHIP_ID: ${{ secrets.TELEGRAM_SAHIP_ID }}
          TELEGRAM_HEDEF: ${{ vars.EMTIA_TELEGRAM_HEDEF }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          # Gerçek gönderim yalnız EMTIA_GONDER=1 iken ve elle kuru seçilmemişken.
          KURU: ${{ (vars.EMTIA_GONDER != '1' || inputs.kuru == true) && '1' || '0' }}
          TARIH: ${{ inputs.tarih }}
          # Site verisi Telegram gönderiminden bağımsız; elle başlatılan kuru koşu siteye yazmaz.
          SITE: ${{ inputs.kuru == true && '0' || '1' }}
        run: |
          ARGS=()
          if [ "$KURU" = "1" ]; then ARGS+=(--kuru); fi
          if [ -n "$TARIH" ]; then ARGS+=(--tarih "$TARIH"); fi
          if [ "$SITE" = "1" ]; then ARGS+=(--site ../site-veri); fi
          python -m rasathane_emtia "${ARGS[@]}"
      - name: Kartları yapıt olarak sakla
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: emtia-kartlar
          path: emtia/cikti/
          if-no-files-found: ignore
      - name: Kaydı depoya yaz
        if: always()
        run: |
          # Var olmayan yol git add'e verilmez (kuru koşuda kayıt ve site verisi yazılmaz)
          git config user.name "senoldak"
          git config user.email "119886960+senoldak@users.noreply.github.com"
          for y in veri ../site-veri/emtia; do if [ -e "$y" ]; then git add "$y"; fi; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Emtia: kayıt ve site verisi $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 10
          done
          exit 1
