name: OPsi ETF

# ETF Radarı: her ABD işlem günü OPsi kanalından sonra, UTC 23:00 = İstanbul 02:00.
# Tatil ve hafta sonu koşuları komutun kendisi tarafından sessizce atlanır.
# Asıl tetikleyici vesaire (workflow_dispatch, kuru=false); cron satırı yedek.
on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:
    inputs:
      kuru:
        description: "Kuru koşu (kartları üret, gönderme)"
        type: boolean
        default: true
      tarih:
        description: "YYYY-AA-GG (boş: bugün; işlem günü kontrolünü atlar)"
        type: string
        default: ""
      hepsi:
        description: "Haftalık kartları da bugün üret (Pazartesi ve Cuma kartları)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: opsi
  cancel-in-progress: false

defaults:
  run:
    working-directory: OPsi

jobs:
  kanal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Kur
        run: pip install -e ../ortak -e .
      - name: Kartları üret ve gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SAHIP_ID: ${{ secrets.TELEGRAM_SAHIP_ID }}
          TELEGRAM_HEDEF: ${{ vars.OPSI_ETF_TELEGRAM_HEDEF }}
          # Gerçek gönderim yalnız OPSI_KANAL_GONDER=1 iken ve elle kuru seçilmemişken.
          KURU: ${{ (vars.OPSI_KANAL_GONDER != '1' || inputs.kuru == true) && '1' || '0' }}
          TARIH: ${{ inputs.tarih }}
          HEPSI: ${{ inputs.hepsi == true && '1' || '0' }}
        run: |
          ARGS=()
          if [ "$KURU" = "1" ]; then ARGS+=(--kuru); fi
          if [ -n "$TARIH" ]; then ARGS+=(--tarih "$TARIH"); fi
          if [ "$HEPSI" = "1" ]; then ARGS+=(--hepsi); fi
          python -m opsi.cli etf "${ARGS[@]}"
      - name: Kartları yapıt olarak sakla
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: opsi-etf-kartlar
          path: OPsi/cikti/etf/
          if-no-files-found: ignore
      - name: Geçmişi depoya yaz
        if: always()
        run: |
          git config user.name "senoldak"
          git config user.email "119886960+senoldak@users.noreply.github.com"
          git add kanal_veri
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "OPsi ETF: veri $(date -u +%F)"
          # Koşu sırasında depoya başka commit gelmiş olabilir: gönderim kaydı kaybolmasın.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 10
          done
          exit 1
