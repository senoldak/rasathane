name: CI

# Ortak paket ve dört fikrin testleri. Kayıt commit'leri (veri klasörleri) CI'ı tetiklemez.
on:
  push:
    branches: [main]
    paths-ignore:
      - "biOF/rasathane/veri/**"
      - "CAPitAL/kanal/veri/**"
      - "INseeder/kanal_veri/**"
      - "OPsi/kanal_veri/**"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.proje }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - proje: ortak
            python: "3.12"
            kur: pip install -e ".[dev]"
            test: pytest -q
          - proje: biOF
            python: "3.12"
            kur: pip install -e ../ortak -e ".[dev]"
            test: pytest -q --cov=bioseeder
          - proje: CAPitAL
            python: "3.12"
            kur: pip install -e ../ortak -e ".[dev,kanal]"
            test: |
              python -m compileall -q capitolseeder tests
              pytest -q --cov=capitolseeder
              python -m capitolseeder.cli seed
          - proje: INseeder
            python: "3.12"
            kur: pip install -r requirements.txt
            test: pytest -q
          - proje: OPsi
            python: "3.13"
            kur: pip install -e ../ortak -e ".[dev]"
            test: |
              python -m ruff check src tests
              python -m black --check src tests
              python -m mypy src/opsi
              python -m pytest -q
          - proje: bist
            python: "3.12"
            kur: pip install -e ".[dev]" ruff black mypy
            test: |
              python -m ruff check rasathane_bist tests
              python -m black -l 100 --check rasathane_bist tests
              python -m mypy --strict rasathane_bist
              python -m pytest -q
    defaults:
      run:
        working-directory: ${{ matrix.proje }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Kur
        run: |
          python -m pip install --upgrade pip
          ${{ matrix.kur }}
      - name: Test
        run: ${{ matrix.test }}
