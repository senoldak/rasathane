name: EVDS yoklama (geçici)
on: workflow_dispatch
jobs:
  yokla:
    runs-on: ubuntu-latest
    steps:
      - run: pip install requests
      - env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        shell: python
        run: |
          import os, re, requests
          B = "https://evds3.tcmb.gov.tr/igmevdsms-dis/"
          H = {"key": os.environ["EVDS_API_KEY"]}
          def al(yol):
              r = requests.get(B + yol, headers=H, timeout=60); print("##", yol[:60], r.status_code); return r.json() if r.ok else []
          for k in (4003, 450301, 3002, 4502, 2001):
              for g in al(f"datagroups/mode=2&code={k}&type=json"):
                  print("GRUP", k, g.get("DATAGROUP_CODE"), g.get("FREQUENCY_STR"), g.get("DATAGROUP_NAME"))
                  if k == 4502:
                      continue
                  for s in al(f"serieList/type=json&code={g['DATAGROUP_CODE']}")[:30]:
                      print("   SERI", s.get("SERIE_CODE"), "|", s.get("SERIE_NAME"), "|", s.get("END_DATE"))
