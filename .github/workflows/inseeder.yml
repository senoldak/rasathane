name: INseeder

# Her sabah İstanbul 07:00 (UTC 04:00), Salı–Cumartesi: önceki iş gününün
# Form 4 alımlarını Rasathane'nin INseeder konusuna gönderir.
# INSEEDER_TELEGRAM_HEDEF değişkeni tanımlı değilse gönderim yapılmaz; kayıt yine güncellenir.
# Asıl tetikleyici vesaire (workflow_dispatch, kuru=false); cron satırı yedek.
on:
  schedule:
    - cron: "0 4 * * 2-6"
  workflow_dispatch:
    inputs:
      kuru:
        description: "Kuru çalıştırma (kartları üret, gönderme, kayıtlara dokunma)"
        type: boolean
        default: true
      tarih:
        description: "Anlatılacak dosyalama günü (YYYY-AA-GG, boş: önceki iş günü)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: inseeder
  cancel-in-progress: false

defaults:
  run:
    working-directory: INseeder

jobs:
  kanal:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # Kuyrukta bekleyen koşu, öncekinin yazdığı kaydı görsün diye dalın en son hali alınır.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Kartları üret ve gönder
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SAHIP_ID: ${{ secrets.TELEGRAM_SAHIP_ID }}
          TELEGRAM_HEDEF: ${{ vars.INSEEDER_TELEGRAM_HEDEF }}
          OLAY: ${{ github.event_name }}
          KURU: ${{ inputs.kuru }}
          TARIH: ${{ inputs.tarih }}
        run: |
          ARGS=()
          if [ "$OLAY" = "workflow_dispatch" ]; then
            if [ "$KURU" = "true" ]; then ARGS+=(--kuru); fi
            if [ -n "$TARIH" ]; then
              if ! [[ "$TARIH" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                echo "tarih YYYY-AA-GG biçiminde olmalı" >&2; exit 2
              fi
              ARGS+=(--tarih "$TARIH")
            fi
          fi
          python -m inseeder.kanal "${ARGS[@]}"

      - name: Kartları yükle
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: inseeder-kartlar
          path: INseeder/kanal_cikti/
          if-no-files-found: ignore

      - name: Kayıtları depoya yaz
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.kuru)
        run: |
          if git diff --quiet -- kanal_veri && [ -z "$(git ls-files --others --exclude-standard kanal_veri)" ]; then
            echo "Kayıtta değişiklik yok."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanal_veri
          git commit -m "INseeder: kayıt güncellemesi"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
