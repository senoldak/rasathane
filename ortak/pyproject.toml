[project]
name = "rasathane-ortak"
version = "0.1.0"
description = "Rasathane ortak kodu: Kâğıt kart çizimi ve Telegram'a tek tek gönderim"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["rasathane_ortak*"]

[tool.setuptools.package-data]
rasathane_ortak = ["fontlar/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
