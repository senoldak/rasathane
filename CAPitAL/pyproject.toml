[project]
name = "capitolseeder"
version = "0.1.0"
description = "Institutional Congressional Trading Intelligence Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "CAPitAL Core Team" }
]
keywords = [
    "congress",
    "trading",
    "stock-act",
    "financial-intelligence",
    "sec-disclosures",
    "alpha-model",
    "fastapi"
]
dependencies = ["rasathane-ortak",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pdfplumber>=0.11.0",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0.80",
    "pytesseract>=0.3.10"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0"
]
kanal = [
    "httpx>=0.27.0",
    "pillow>=10.2.0",
    "yfinance>=0.2.40"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["capitolseeder*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
testpaths = ["tests"]
