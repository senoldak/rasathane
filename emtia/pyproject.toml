[project]
name = "rasathane-emtia"
version = "0.1.0"
description = "Rasathane Emtia: vadeli fiyatlar, oranlar, gram altın, EIA stokları ve CFTC pozisyonları"
requires-python = ">=3.10"
dependencies = ["rasathane-ortak", "yfinance>=1.7,<2", "pandas>=2.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff", "black", "mypy", "types-requests", "pandas-stubs"]

[tool.setuptools.packages.find]
include = ["rasathane_emtia*"]

[tool.setuptools.package-data]
rasathane_emtia = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# BLE001: tek emtia ya da rapor düşerse akış sürer (bilinçli geniş except)
ignore = ["BLE001"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
